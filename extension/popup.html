<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Z.AI Bridge 8.0</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #090d16;
      color: #f3f4f6;
      width: 260px;
      padding: 20px;
      overflow: hidden;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      font-size: 12px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .dot.online { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-label { flex: 1; color: #9ca3af; }
    .status-val { font-weight: 600; }

    .btn-open {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
      transition: all 0.2s ease;
    }
    .btn-open:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
      transform: translateY(-1px);
    }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #4b5563;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span class="logo-text">Z.AI Bridge 8.0</span>
  </div>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span class="status-label">Server:</span>
    <span class="status-val" id="statusText">Offline</span>
  </div>

  <button class="btn-open" id="btnOpen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Mở Bảng Điều Khiển
  </button>
  <div class="hint">Tài khoản · Proxy · Cài đặt — tất cả trong sidePanel</div>

  <script src="popup.js"></script>
</body>
</html>
